apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  namespace: oficina
  labels:
    app: execution-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
    spec:
      automountServiceAccountToken: false
      containers:
        - name: execution-service
          image: ghcr.io/jaimorais2007/execution-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: execution-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: https://otlp.nr-data.net
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_COMPRESSION
              value: gzip
            - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
              value: delta
            - name: OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT
              value: "4095"
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: execution-service-secret
                  key: OTEL_EXPORTER_OTLP_HEADERS
                  optional: true
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: execution-service-secret
                  key: CONNECTION_STRING
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: execution-service-secret
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: execution-service-secret
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            - name: AWS__Region
              value: us-east-1
            - name: AWS__SqsQueueUrl
              valueFrom:
                secretKeyRef:
                  name: execution-service-secret
                  key: SQS_QUEUE_URL
                  optional: true
            - name: AWS__SnsTopics__CustomerDeleted
              value: arn:aws:sns:us-east-1:168126498555:oficina-CustomerDeleted
            - name: AWS__SnsTopics__VehicleDeleted
              value: arn:aws:sns:us-east-1:168126498555:oficina-VehicleDeleted
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
